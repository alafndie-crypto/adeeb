<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام حساب الإهلاك الشهري — أصالة الهرم التجاري</title>
<style>
  :root{
    --ink:#132623;
    --paper:#F4F6F3;
    --panel:#FFFFFF;
    --line:#DCE3DD;
    --teal:#0E4D46;
    --teal-dark:#0A3733;
    --teal-soft:#E4EEEC;
    --amber:#B4772F;
    --amber-soft:#F6E9D9;
    --muted:#5C6B66;
    --danger:#A23B2E;
    --danger-soft:#F5E1DD;
    --blue:#2B5D8C;
    --blue-soft:#E7EEF5;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Segoe UI","Tahoma","IBM Plex Sans Arabic",Arial,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    padding-bottom:34px;
  }
  ::selection{background:var(--amber-soft);}

  header{
    background:var(--teal-dark);
    color:#F3F0E8;
    padding:18px 26px 14px;
    border-bottom:3px solid var(--amber);
  }
  .header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  header h1{margin:0;font-size:18.5px;font-weight:700;letter-spacing:.2px;}
  header p{margin:4px 0 0;color:#BFD2CC;font-size:12.5px;}
  .year-switcher{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:7px 10px;border-radius:var(--radius);}
  .year-switcher label{font-size:11.5px;color:#BFD2CC;}
  .year-switcher select{background:#0E4D46;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:5px 8px;font-family:inherit;font-size:13px;}
  .year-switcher select option{color:#111;}
  .year-switcher button{background:var(--amber);border:none;color:#2A1B08;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;font-family:inherit;}

  nav{
    background:var(--teal);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    padding:9px 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  nav button, nav select{
    background:transparent;
    border:1px solid rgba(255,255,255,.35);
    color:#EAF2EF;
    padding:6px 12px;
    border-radius:var(--radius);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  nav button:hover{background:rgba(255,255,255,.12);}
  nav button.active{background:var(--amber);border-color:var(--amber);color:#2A1B08;font-weight:700;}
  nav select{background:#0E4D46;color:#fff;}
  nav select option{color:#0A3733;background:#fff;font-weight:600;}
  .nav-gap{flex:1;}
  .nav-sep{width:1px;background:rgba(255,255,255,.25);align-self:stretch;margin:0 4px;}

  main{padding:20px 22px 40px;max-width:1220px;margin:0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 8px;margin-bottom:18px;}
  .panel h2{margin:0 0 4px;font-size:16px;color:var(--teal-dark);}
  .panel h3{margin:18px 0 8px;font-size:14.5px;color:var(--teal-dark);}
  .panel .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;}

  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
  th{background:var(--teal-soft);color:var(--teal-dark);font-weight:700;font-size:12.2px;border-bottom:2px solid var(--teal);}
  td:first-child, th:first-child{text-align:right;font-weight:600;white-space:normal;min-width:130px;}
  tbody tr:hover{background:#FAFCF9;}
  tfoot td{font-weight:700;background:var(--amber-soft);border-top:2px solid var(--amber);color:var(--teal-dark);}

  .num-input{width:100px;padding:6px 7px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:13.5px;font-family:inherit;direction:ltr;}
  .num-input:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  /* إخفاء أسهم الزيادة/النقصان في أي حقل رقمي (احتياطًا) */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type="number"]{ -moz-appearance:textfield; }
  .text-input{width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-family:inherit;text-align:right;}
  .muted-cell{color:var(--muted);}
  .accent-cell{color:var(--teal-dark);font-weight:700;}
  .del-btn{background:var(--danger-soft);color:var(--danger);border:1px solid #E7C4BB;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;}
  .del-btn:hover{background:#efd0c8;}

  .row-actions{display:flex;gap:10px;align-items:center;margin:12px 0 16px;flex-wrap:wrap;}
  .btn{background:var(--teal);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;font-family:inherit;}
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal-dark);border:1px solid var(--teal);}
  .btn.secondary:hover{background:var(--teal-soft);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#832c22;}

  .rate-box{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--teal-soft);padding:10px 14px;border-radius:var(--radius);width:fit-content;flex-wrap:wrap;}
  .rate-box input{width:70px;text-align:center;padding:5px;border:1px solid var(--line);border-radius:4px;}
  .rate-box.blue{background:var(--blue-soft);}

  .field-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field-row label{font-size:13px;color:var(--muted);min-width:150px;}

  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:150px;flex:1;}
  .card .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .card .value{font-size:18px;font-weight:700;color:var(--teal-dark);}
  .card.highlight{border-color:var(--amber);background:var(--amber-soft);}
  .card.highlight .value{color:#7A4A16;}
  .card a.btn, .card button.btn{margin-top:8px;display:inline-block;}
  .progress-track{background:var(--teal-soft);border-radius:20px;height:10px;overflow:hidden;margin-top:8px;}
  .progress-fill{background:var(--teal);height:100%;border-radius:20px;transition:width .2s;}
  .mini-list{list-style:none;margin:0;padding:0;}
  .mini-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .mini-list li:last-child{border-bottom:none;}
  .mini-list .rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);font-size:11px;font-weight:700;margin-left:8px;}
  .mini-list .name{display:flex;align-items:center;}
  .mini-list .amt{font-weight:700;color:var(--teal-dark);}

  .rate-toggle{display:flex;align-items:center;gap:6px;}
  .rate-toggle input[type=checkbox]{width:16px;height:16px;}
  .rate-toggle input[type=number]{width:65px;padding:4px;border:1px solid var(--line);border-radius:4px;text-align:center;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .bar-label{width:150px;font-size:12.8px;text-align:right;flex-shrink:0;}
  .bar-row .bar-track{flex:1;background:var(--teal-soft);border-radius:4px;height:22px;position:relative;overflow:hidden;}
  .bar-row .bar-fill{background:var(--teal);height:100%;border-radius:4px;transition:width .4s ease;}
  .bar-row.top .bar-fill{background:var(--amber);}
  .bar-row .bar-value{width:110px;font-size:12.5px;text-align:left;flex-shrink:0;color:var(--muted);}

  .chart-svg{width:100%;height:auto;display:block;}

  /* بانرات التنبيه — ألوان مختلفة حسب الأهمية */
  .banner{padding:10px 14px;border-radius:6px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-inline-start:4px solid;}
  .banner-warning{background:var(--danger-soft);border-color:var(--danger);color:#7a2d20;}
  .banner-info{background:var(--blue-soft);border-color:var(--blue);color:#1F3A52;}

  /* شريط الدعم الفني — ثابت دائم الظهور بالمنتصف */
  #supportBar{
    position:fixed;bottom:0;right:0;left:0;
    background:var(--teal-dark);
    color:#E9F1EE;
    font-size:12.5px;
    border-top:2px solid var(--amber);
    z-index:30;
    display:flex;justify-content:center;align-items:center;
    padding:8px 16px;
    text-align:center;
  }
  #supportBar b{color:var(--amber);font-weight:700;}

  /* مؤشر الحفظ */
  #saveIndicator{
    position:fixed;top:8px;left:8px;
    background:var(--teal-dark);color:#D8F0E8;
    padding:5px 12px;border-radius:20px;font-size:11.5px;
    opacity:0;transition:opacity .3s ease;
    z-index:50;pointer-events:none;
    border:1px solid var(--amber);
  }
  #saveIndicator.show{opacity:1;}

  /* نوافذ منبثقة (Modal) */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,30,27,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;
  }
  .modal-box{
    background:#fff;border-radius:8px;padding:20px;
    width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .modal-box h3{margin:0 0 8px;font-size:15.5px;color:var(--teal-dark);}
  .modal-box .modal-msg{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6;}
  .modal-box input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:14px;font-family:inherit;margin-bottom:4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

  /* توست */
  .toast{
    position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--teal-dark);color:#fff;padding:10px 18px;border-radius:24px;
    font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    z-index:200;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.toast-error{background:var(--danger);}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--muted);}
  .spinner{width:30px;height:30px;border:3px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media print{
    nav,.row-actions,header p,#supportBar,#saveIndicator,.no-print,.header-top .year-switcher{display:none !important;}
    header{background:#fff;color:#000;border-bottom:2px solid #000;}
    body{background:#fff;padding-bottom:0;}
    .panel{border:none;padding:0;}
    th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    tfoot td{background:#f2e6d2 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media (max-width:640px){
    main{padding:14px;}
    header{padding:14px;}
    table{font-size:12px;}
    th,td{padding:6px;}
    .num-input{width:80px;}
    .bar-row .bar-label{width:100px;font-size:11.5px;}

    /* الجدول الشهري يتحول لبطاقات على الجوال */
    table.month-table thead{display:none;}
    table.month-table, table.month-table tbody, table.month-table tr, table.month-table td{display:block;width:100%;}
    table.month-table tbody tr{margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
    table.month-table tbody td{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding:7px 2px;text-align:left;white-space:normal;}
    table.month-table tbody td:first-child{font-weight:700;color:var(--teal-dark);border-bottom:2px solid var(--teal-soft);justify-content:flex-start;}
    table.month-table tbody td:not(:first-child)::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:600;}
    table.month-table tfoot, table.month-table tfoot tr, table.month-table tfoot td{display:block;}
    table.month-table tfoot tr{background:var(--amber-soft);border-radius:6px;padding:8px 10px;}
    table.month-table tfoot td{display:flex;justify-content:space-between;border-bottom:1px dashed #e2c68e;padding:5px 2px;}
    table.month-table tfoot td:not(:first-child)::before{content:attr(data-label);color:#7A4A16;font-size:11px;font-weight:600;}
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1 id="companyTitle">نظام حساب الإهلاك الشهري</h1>
      <p id="companySub">أصالة الهرم التجاري</p>
    </div>
    <div class="year-switcher">
      <label>السنة:</label>
      <select id="headerYearSel"></select>
      <button id="headerNewYearBtn">+ سنة جديدة</button>
    </div>
  </div>
</header>

<nav id="navBar"></nav>
<main id="mainArea">
  <div class="loading-wrap"><div class="spinner"></div><span>جارِ التحميل...</span></div>
</main>

<div id="saveIndicator"></div>

<div id="supportBar">
  <span>الدعم الفني: <b id="supportEngName">م. صلاح غالب</b></span>
</div>

<script>
/* ============================= ثوابت ============================= */
const MONTH_NAMES = ["", "يناير","فبراير","مارس","ابريل","مايو","يونيو","يوليو","اغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const MONTH_SHORT = ["", "ينا","فبر","مار","ابر","ماي","يون","يول","اغس","سبت","اكت","نوف","ديس"];
const DB_NAME = "AsalatAlHaramDepreciationDB";
const DB_VERSION = 1;
const STORE_NAME = "kv";
const OLD_LS_KEY = "ahlak_asalat_2026_v1";
const COMPANY_NAME = "أصالة الهرم التجاري";
const SUPPORT_NAME = "م. صلاح غالب";

/* ============================= IndexedDB ============================= */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME, {keyPath:"key"});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbGet(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess=()=>resolve(req.result ? req.result.value : undefined);
    req.onerror=()=>reject(req.error);
  }));
}
function idbSet(key, value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readwrite");
    const req = tx.objectStore(STORE_NAME).put({key, value});
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  }));
}

/* ============================= البيانات الافتراضية ============================= */
function freshCategories(){
  return [
    {id:"c1",  name:"سيارات الشركة",   rateOverride:null},
    {id:"c2",  name:"ديكورات المعارض", rateOverride:null},
    {id:"c3",  name:"اثاث ومفروشات",   rateOverride:null},
    {id:"c4",  name:"أنظمة",           rateOverride:null},
    {id:"c5",  name:"اجهزة كمبيوتر",   rateOverride:null},
    {id:"c6",  name:"كيمرات",          rateOverride:null},
    {id:"c7",  name:"أجهزة كهربائيه",  rateOverride:null},
    {id:"c8",  name:"عدد وأدوات",      rateOverride:null},
    {id:"c9",  name:"الالات والمعدات", rateOverride:null},
    {id:"c10", name:"تجسينات",         rateOverride:null},
    {id:"c11", name:"اعمال تلييس",     rateOverride:null}
  ];
}
function defaultState(){
  return {
    settings:{ defaultRate:15, editPassword:null, lastBackupAt:null },
    categories: freshCategories(),
    currentYear: 2026,
    years:{
      2026:{
        locked:false,
        openingBalances:{c1:7448,c2:13137,c3:7120,c4:4602,c5:17368,c6:0,c7:0,c8:19310,c9:0,c10:104867,c11:0},
        months:{
          1:{additions:{c2:75224.85, c3:521.74, c5:3921.74, c8:1133.91, c9:2000}},
          2:{additions:{c1:33308.7, c2:4499.1, c5:4540, c7:843.48, c8:4255.65}},
          3:{additions:{c2:104806.54, c5:546.96, c8:339.13}},
          4:{additions:{c2:80423.98, c5:826.09, c10:40135}},
          5:{additions:{c5:519, c10:2857.39}},
          6:{additions:{c2:7911.23, c8:280}},
          7:{additions:{c5:426.09, c8:324}},
          8:{additions:{c5:3478.26, c10:62781.6}},
          9:{additions:{c1:1000, c2:2000, c3:5000, c4:2000, c5:2000, c6:200, c10:50000}},
          10:{additions:{}}, 11:{additions:{}}, 12:{additions:{}}
        }
      }
    }
  };
}
function migrateOld(old){
  const s = defaultState();
  s.settings.defaultRate = Number(old.rate)||15;
  s.categories = (old.categories||[]).map(c=>({id:c.id, name:c.name, rateOverride:null}));
  const openingBalances = {};
  (old.categories||[]).forEach(c=>{ openingBalances[c.id] = Number(c.b2025)||0; });
  s.currentYear = 2026;
  s.years = { 2026: { locked:false, openingBalances, months: old.months || {} } };
  for(let m=1;m<=12;m++) if(!s.years[2026].months[m]) s.years[2026].months[m] = {additions:{}};
  return s;
}

let state = null;

async function loadOrInit(){
  let saved;
  try{ saved = await idbGet("appState"); }catch(e){ saved = undefined; }
  if(saved){ state = saved; return; }
  try{
    const oldRaw = localStorage.getItem(OLD_LS_KEY);
    if(oldRaw){
      state = migrateOld(JSON.parse(oldRaw));
      await idbSet("appState", state);
      return;
    }
  }catch(e){}
  state = defaultState();
  await idbSet("appState", state);
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    idbSet("appState", state).then(flashSaved).catch(()=>{});
  }, 150);
}
function flashSaved(){
  const ind = document.getElementById("saveIndicator");
  if(!ind) return;
  ind.textContent = "✓ تم الحفظ";
  ind.classList.add("show");
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>ind.classList.remove("show"), 1200);
}

/* ============================= نوافذ منبثقة بديلة عن prompt/confirm/alert ============================= */
function modalPromptText({title, message="", placeholder="", isPassword=false, defaultValue=""}){
  return new Promise(resolve=>{
    const overlay = el("div",{class:"modal-overlay"});
    const box = el("div",{class:"modal-box"});
    box.appendChild(el("h3",{text:title}));
    if(message) box.appendChild(el("p",{class:"modal-msg", text:message}));
    const input = el("input",{type:isPassword?"password":"text", value:defaultValue, placeholder});
    box.appendChild(input);
    const finish = (val)=>{ if(overlay.parentNode) document.body.removeChild(overlay); resolve(val); };
    const actions = el("div",{class:"modal-actions"},[
      el("button",{class:"btn ghost", text:"إلغاء", onclick:()=>finish(null)}),
      el("button",{class:"btn", text:"موافق", onclick:()=>finish(input.value)})
    ]);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter") finish(input.value);
      if(e.key==="Escape") finish(null);
    });
    setTimeout(()=>input.focus(), 30);
  });
}
function modalConfirm({title, message="", danger=false, okLabel="تأكيد"}){
  return new Promise(resolve=>{
    const overlay = el("div",{class:"modal-overlay"});
    const box = el("div",{class:"modal-box"});
    box.appendChild(el("h3",{text:title}));
    if(message) box.appendChild(el("p",{class:"modal-msg", text:message}));
    const finish = (val)=>{ if(overlay.parentNode) document.body.removeChild(overlay); resolve(val); };
    const actions = el("div",{class:"modal-actions"},[
      el("button",{class:"btn ghost", text:"إلغاء", onclick:()=>finish(false)}),
      el("button",{class: danger?"btn danger":"btn", text:okLabel, onclick:()=>finish(true)})
    ]);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}
function showToast(message, type){
  const toast = el("div",{class:"toast"+(type==="error"?" toast-error":""), text:message});
  document.body.appendChild(toast);
  requestAnimationFrame(()=>toast.classList.add("show"));
  setTimeout(()=>{ toast.classList.remove("show"); setTimeout(()=>toast.remove(),300); }, 2200);
}

/* ============================= مساعدات الوصول للبيانات ============================= */
function getCat(id){ return state.categories.find(c=>c.id===id); }
function getYearData(year){ return state.years[year]; }
function ensureMonth(year, m){
  const yd = getYearData(year);
  if(!yd.months[m]) yd.months[m] = {additions:{}};
  if(!yd.months[m].additions) yd.months[m].additions = {};
  return yd.months[m];
}
function getAdd(year, catId, m){
  const yd = getYearData(year);
  if(!yd || !yd.months[m] || !yd.months[m].additions) return 0;
  return Number(yd.months[m].additions[catId]) || 0;
}
function setAdd(year, catId, m, val){
  ensureMonth(year, m).additions[catId] = val;
  save();
}
function getRate(catId){
  const cat = getCat(catId);
  if(cat && cat.rateOverride!=null && cat.rateOverride!=="") return Number(cat.rateOverride);
  return Number(state.settings.defaultRate)||0;
}
function getOpening(year, catId){
  const yd = getYearData(year);
  return (yd && yd.openingBalances && yd.openingBalances[catId]!=null) ? Number(yd.openingBalances[catId]) : 0;
}
function setOpening(year, catId, val){
  const yd = getYearData(year);
  if(!yd.openingBalances) yd.openingBalances = {};
  yd.openingBalances[catId] = val;
  save();
}

/* ============================= المنطق الحسابي ============================= */
function calcD(year, catId, m){ return getAdd(year, catId, m) * getRate(catId) / 100; }
function calcE(year, catId, m){ return calcD(year, catId, m) / (13-m); }
function calcCum(year, catId, uptoMonth){
  // إجمالي الأقساط الشهرية لكل الإضافات من بداية السنة حتى شهر uptoMonth،
  // كل قسط يُضاف مرة واحدة فقط في شهر إضافته ثم يبقى ضمن المجمّع (لا يتكرر
  // شهريًا) — هذا مطابق لملف الشركة الرسمي (اهلاكات_2026.xlsx).
  let sum=0;
  for(let k=1;k<=uptoMonth;k++) sum += calcE(year, catId, k);
  return sum;
}
function calcH(year, catId, m){ return getOpening(year, catId) + calcCum(year, catId, m); }
// "اهلاك يخص الشهر" = قسط إضافات هذا الشهر فقط (= الفرق بين المجمّع الحالي والسابق،
// وهو نفس قيمة calcE لأن كل قسط يُضاف مرة واحدة فقط — راجع calcCum أعلاه).
function calcMonthCharge(year, catId, m){
  return calcE(year, catId, m);
}

function existingYears(){ return Object.keys(state.years).map(Number).sort((a,b)=>a-b); }
function isYearLocked(year){ const yd=getYearData(year); return !!(yd && yd.locked); }
function setYearLocked(year, val){ const yd=getYearData(year); if(yd){ yd.locked=val; save(); } }

function incompleteMonths(year){
  const yd = getYearData(year);
  const missing=[];
  for(let m=1;m<=12;m++){
    const mo = yd.months[m];
    if(!mo || !mo.additions || Object.keys(mo.additions).length===0) missing.push(MONTH_NAMES[m]);
  }
  return missing;
}

function createNewYear(newYear){
  if(state.years[newYear]) return;
  const prevActiveYear = state.currentYear;
  const years = existingYears();
  const prevYear = Math.max(...years.filter(y=>y<newYear));
  const openingBalances = {};
  state.categories.forEach(cat=>{
    openingBalances[cat.id] = isFinite(prevYear) ? calcH(prevYear, cat.id, 12) : 0;
  });
  const months = {};
  for(let m=1;m<=12;m++) months[m] = {additions:{}};
  state.years[newYear] = { locked:false, openingBalances, months };
  state.currentYear = newYear;
  if(state.years[prevActiveYear] && prevActiveYear!==newYear) setYearLocked(prevActiveYear, true);
  save();
}

async function openNewYearFlow(){
  const years = existingYears();
  const suggested = Math.max(...years)+1;
  const missing = incompleteMonths(state.currentYear);
  if(missing.length>0){
    const ok = await modalConfirm({title:"أشهر ناقصة", message:`لم يتم إدخال بيانات للأشهر التالية في سنة ${state.currentYear}: ${missing.join("، ")}.\nهل تريد المتابعة وفتح سنة جديدة على أي حال؟`});
    if(!ok) return;
  }
  const input = await modalPromptText({title:"افتتاح سنة جديدة", message:"أدخل رقم السنة:", defaultValue:String(suggested)});
  if(!input) return;
  const y = parseInt(input,10);
  if(!y || state.years[y]){ showToast("سنة غير صالحة أو موجودة مسبقًا","error"); return; }
  createNewYear(y);
  currentMonth = 1;
  currentView = "month";
  showToast("تم فتح سنة "+y);
  render();
}

/* ============================= أدوات DOM ============================= */
function fmt(n){
  if(n===undefined||n===null||isNaN(n)) n=0;
  return n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ---- تحويل/تنسيق حقول الإدخال الرقمية: أرقام إنجليزية فقط + فواصل آلاف، بدون أسهم ---- */
const AR_DIGITS  = "٠١٢٣٤٥٦٧٨٩";
const FA_DIGITS  = "۰۱۲۳۴۵۶۷۸۹";
function toEnglishDigits(str){
  return String(str==null?"":str).replace(/[٠-٩]/g, d=>String(AR_DIGITS.indexOf(d)))
                                   .replace(/[۰-۹]/g, d=>String(FA_DIGITS.indexOf(d)));
}
// ينظّف النص المُدخل ويحوّله إلى نص منسّق للعرض داخل الحقل (أرقام إنجليزية + فواصل آلاف)
function formatNumberInputStr(raw){
  let s = toEnglishDigits(raw).replace(/[^\d.]/g, ""); // إبقاء الأرقام والنقطة العشرية فقط
  const dot = s.indexOf(".");
  if(dot !== -1) s = s.slice(0, dot+1) + s.slice(dot+1).replace(/\./g, ""); // نقطة واحدة فقط
  let [intPart, decPart] = s.split(".");
  intPart = (intPart||"").replace(/^0+(?=\d)/, "");
  const withCommas = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  let out = withCommas;
  if(decPart !== undefined) out += "." + decPart;
  else if(s.endsWith(".")) out += ".";
  return out;
}
function parseFormattedNumber(str){
  return Number(String(str==null?"":str).replace(/,/g, "")) || 0;
}
// يُستخدم داخل oninput لكل حقل رقمي: ينسّق القيمة مباشرة أثناء الكتابة (فواصل + أرقام إنجليزية)
// مع الحفاظ على موضع المؤشّر، ثم يستدعي onValue بالرقم الفعلي المُدخل
function handleNumericInput(e, onValue){
  const input = e.target;
  const cursorBefore = input.selectionStart ?? input.value.length;
  const digitsBeforeCursor = toEnglishDigits(input.value.slice(0, cursorBefore)).replace(/[^\d.]/g,"").length;
  const formatted = formatNumberInputStr(input.value);
  input.value = formatted;
  let count = 0, pos = formatted.length;
  for(let i=0; i<formatted.length; i++){
    if(/[\d.]/.test(formatted[i])) count++;
    if(count >= digitsBeforeCursor){ pos = i+1; break; }
  }
  input.setSelectionRange(pos, pos);
  onValue(parseFormattedNumber(formatted));
}
// خصائص جاهزة لحقل رقمي نصّي (بدون أسهم، وبدون لوحة مفاتيح عربية للأرقام)
function numInputAttrs(value){
  return {type:"text", inputmode:"decimal", autocomplete:"off", style:"direction:ltr;", value: (value===""||value==null) ? "" : formatNumberInputStr(String(value))};
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="text") e.textContent = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==="style") e.setAttribute("style", attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==="string"? document.createTextNode(c) : c);
  });
  return e;
}
const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs={}){
  const e = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function pickInitialMonth(){
  const yd = getYearData(state.currentYear);
  for(let m=1;m<=12;m++){
    const mo = yd.months[m];
    if(!mo || !mo.additions || Object.keys(mo.additions).length===0) return m;
  }
  return 12;
}
// الشهر الذي يُفتح افتراضيًا عند تشغيل التطبيق: الشهر الحالي فعليًا (حسب تاريخ اليوم)
// إن كانت السنة المفتوحة حاليًا في التطبيق هي نفسها السنة الحالية فعليًا،
// وإلا (مثلاً بداية سنة جديدة لم تُفتح بعد) يُستخدم أول شهر فارغ كما كان سابقًا.
function pickStartupMonth(){
  const now = new Date();
  if(state.currentYear === now.getFullYear()) return now.getMonth()+1;
  return pickInitialMonth();
}

/* ============================= الرئيسية (Dashboard) ============================= */
function renderDashboard(){
  const year = state.currentYear;
  const wrap = el("div");

  if(needsBackupReminder() && !backupBannerDismissed){
    wrap.appendChild(renderBackupBanner());
  }

  const yd = getYearData(year);
  const filledMonths = [];
  for(let m=1;m<=12;m++){
    if(yd.months[m] && yd.months[m].additions && Object.keys(yd.months[m].additions).length>0) filledMonths.push(m);
  }
  const lastMonth = filledMonths.length ? Math.max(...filledMonths) : null;
  const nextMonth = pickInitialMonth();
  const realNow = new Date();
  const realCurrentMonth = (year===realNow.getFullYear()) ? realNow.getMonth()+1 : null;

  const totalOpening = state.categories.reduce((s,c)=>s+getOpening(year,c.id),0);
  const hasAnyData = totalOpening>0 || filledMonths.length>0;

  // حالة سنة جديدة تمامًا لا توجد فيها أي بيانات بعد — رسالة ترحيبية توجيهية بدل شاشة فارغة الشكل
  if(!hasAnyData){
    const empty = el("div",{class:"panel"});
    empty.appendChild(el("h2",{text:"مرحبًا 👋 لنبدأ إعداد سجل الإهلاكات"}));
    empty.appendChild(el("div",{class:"hint",text:"لا توجد بيانات مُدخلة بعد لسنة "+year+". ابدأ بإعداد الفئات والأرصدة الافتتاحية والنسب، ثم أدخل إضافات كل شهر."}));
    empty.appendChild(el("div",{class:"row-actions"},[
      el("button",{class:"btn", text:"⚙ ابدأ بالإعداد (الفئات والأرصدة)", onclick:()=>{currentView="setup"; render();}}),
      el("button",{class:"btn secondary", text:"⭱ استيراد نسخة احتياطية سابقة", onclick:triggerImport})
    ]));
    wrap.appendChild(empty);
    return wrap;
  }

  const totalHFinal = state.categories.reduce((s,c)=>s+calcH(year,c.id, lastMonth||1),0);

  const categoryTotals = state.categories.map(cat=>{
    const sumE = calcCum(year, cat.id, lastMonth||1); // إجمالي إهلاك الفئة حتى آخر شهر تم إدخاله (يشمل الترحيل)
    return {cat, sumE};
  }).sort((a,b)=>b.sumE-a.sumE);
  const topCat = categoryTotals[0];

  const cards = el("div",{class:"cards"});
  cards.appendChild(el("div",{class:"card"},[
    el("div",{class:"label",text:"آخر شهر تم إدخال بياناته"}),
    el("div",{class:"value",text: lastMonth ? MONTH_NAMES[lastMonth]+" "+year : "لا يوجد بعد"}),
    el("button",{class:"btn small secondary", text:"فتح شهر "+MONTH_NAMES[nextMonth], onclick:()=>{currentMonth=nextMonth; currentView="month"; render();}})
  ]));
  cards.appendChild(el("div",{class:"card highlight"},[
    el("div",{class:"label",text:"الاستهلاك الحالي (سنة "+year+")"}),
    el("div",{class:"value",text:fmt(totalHFinal)})
  ]));
  if(realCurrentMonth){
    const monthAdd = state.categories.reduce((s,c)=>s+getAdd(year,c.id,realCurrentMonth),0);
    cards.appendChild(el("div",{class:"card"},[
      el("div",{class:"label",text:"شهرنا الحالي: "+MONTH_NAMES[realCurrentMonth]}),
      el("div",{class:"value",text: monthAdd>0 ? "إضافات "+fmt(monthAdd) : "لم تُدخل إضافات بعد"}),
      el("button",{class:"btn small secondary", text:"فتح الشهر", onclick:()=>{currentMonth=realCurrentMonth; currentView="month"; render();}})
    ]));
  }
  wrap.appendChild(cards);

  const progressPanel = el("div",{class:"panel"});
  progressPanel.appendChild(el("h2",{text:"تقدّم إدخال بيانات سنة "+year}));
  progressPanel.appendChild(el("div",{class:"hint",text: filledMonths.length+" من 12 شهرًا تم إدخال بياناتها"}));
  progressPanel.appendChild(el("div",{class:"progress-track"},[
    el("div",{class:"progress-fill", style:"width:"+Math.round(filledMonths.length/12*100)+"%;"})
  ]));
  wrap.appendChild(progressPanel);

  if(categoryTotals.some(x=>x.sumE>0)){
    const topPanel = el("div",{class:"panel"});
    topPanel.appendChild(el("h2",{text:"أعلى الفئات استهلاكًا هذه السنة"}));
    const list = el("ul",{class:"mini-list"});
    categoryTotals.filter(x=>x.sumE>0).slice(0,3).forEach((x,i)=>{
      list.appendChild(el("li",{},[
        el("span",{class:"name"},[ el("span",{class:"rank", text:String(i+1)}), el("span",{text:x.cat.name}) ]),
        el("span",{class:"amt", text:fmt(x.sumE)})
      ]));
    });
    topPanel.appendChild(list);
    topPanel.appendChild(el("button",{class:"btn small secondary", text:"عرض كل التقارير", onclick:()=>{currentView="reports"; render();}}));
    wrap.appendChild(topPanel);
  }

  const panel = el("div",{class:"panel"});
  panel.appendChild(el("h2",{text:"وصول سريع"}));
  const quick = el("div",{class:"row-actions"},[
    el("button",{class:"btn", text:"📝 إدخال بيانات الشهر", onclick:()=>{currentMonth=nextMonth; currentView="month"; render();}}),
    el("button",{class:"btn secondary", text:"📊 ملخص السنة", onclick:()=>{currentView="summary"; render();}}),
    el("button",{class:"btn secondary", text:"📈 التقارير", onclick:()=>{currentView="reports"; render();}}),
    el("button",{class:"btn ghost", text:"⭳ نسخة احتياطية", onclick:exportBackup})
  ]);
  panel.appendChild(quick);
  wrap.appendChild(panel);

  return wrap;
}

/* ============================= شاشة الشهر ============================= */
function buildMonthTable(year, m){
  const locked = isYearLocked(year);
  const table = el("table",{class:"month-table"});
  const remaining = 13-m;
  const headers = ["الفئة","الرصيد الافتتاحي","النسبة%","الإضافات","اهلاك الإضافات","اهلاك يخص "+MONTH_NAMES[m]+" (÷"+remaining+")","مجمع حتى الشهر السابق","مجمع حتى "+MONTH_NAMES[m],"الاستهلاك الحالي"];
  table.appendChild(el("thead",{},[
    el("tr",{}, headers.map(h=>el("th",{text:h})))
  ]));

  const tbody = el("tbody");
  let totals = {b:0,c:0,d:0,e:0,f:0,g:0,h:0};

  state.categories.forEach(cat=>{
    const B = getOpening(year, cat.id);
    const C = getAdd(year, cat.id, m);
    const D = calcD(year, cat.id, m);
    const E = calcMonthCharge(year, cat.id, m);
    const F = m>1 ? calcCum(year, cat.id, m-1) : 0;
    const G = calcCum(year, cat.id, m);
    const H = calcH(year, cat.id, m);

    totals.b+=B; totals.c+=C; totals.d+=D; totals.e+=E; totals.f+=F; totals.g+=G; totals.h+=H;

    tbody.appendChild(el("tr",{"data-cat-id":cat.id},[
      el("td",{text:cat.name}),
      el("td",{class:"muted-cell", "data-label":headers[1], text:fmt(B)}),
      el("td",{class:"muted-cell", "data-label":headers[2], text:getRate(cat.id)+"%"}),
      el("td",{"data-label":headers[3]},[
        el("input",{class:"num-input", ...numInputAttrs(C||""), placeholder:"0", ...(locked?{disabled:"disabled"}:{}), oninput:(e)=>{
          handleNumericInput(e, v=>{
            setAdd(year, cat.id, m, v);
            updateMonthTableCalculations(table, year, m);
          });
        }})
      ]),
      el("td",{class:"muted-cell", "data-label":headers[4], "data-field":"D", text:fmt(D)}),
      el("td",{class:"muted-cell", "data-label":headers[5], "data-field":"E", text:fmt(E)}),
      el("td",{class:"muted-cell", "data-label":headers[6], "data-field":"F", text:fmt(F)}),
      el("td",{class:"accent-cell", "data-label":headers[7], "data-field":"G", text:fmt(G)}),
      el("td",{class:"accent-cell", "data-label":headers[8], "data-field":"H", text:fmt(H)})
    ]));
  });
  table.appendChild(tbody);
  table.appendChild(el("tfoot",{},[
    el("tr",{},[
      el("td",{text:"الإجمالي"}),
      el("td",{"data-label":headers[1], text:fmt(totals.b)}),
      el("td",{"data-label":headers[2], text:"—"}),
      el("td",{"data-label":headers[3], "data-total-field":"c", text:fmt(totals.c)}),
      el("td",{"data-label":headers[4], "data-total-field":"d", text:fmt(totals.d)}),
      el("td",{"data-label":headers[5], "data-total-field":"e", text:fmt(totals.e)}),
      el("td",{"data-label":headers[6], "data-total-field":"f", text:fmt(totals.f)}),
      el("td",{"data-label":headers[7], "data-total-field":"g", text:fmt(totals.g)}),
      el("td",{"data-label":headers[8], "data-total-field":"h", text:fmt(totals.h)})
    ]),
    el("tr",{},[
      el("td",{text:"متوسط الشهر (الرصيد الافتتاحي ÷ 12)"}),
      el("td",{"data-label":headers[1], text:fmt(totals.b/12)}),
      el("td",{"data-label":headers[2], text:"—"}),
      el("td",{"data-label":headers[3], text:"—"}),
      el("td",{"data-label":headers[4], text:"—"}),
      el("td",{"data-label":headers[5], text:"—"}),
      el("td",{"data-label":headers[6], text:"—"}),
      el("td",{"data-label":headers[7], text:"—"}),
      el("td",{"data-label":headers[8], text:"—"})
    ])
  ]));
  return {table, totals};
}

// تحديث الأعمدة المحسوبة فقط (بدون إعادة بناء الجدول) حتى لا يفقد حقل
// الإدخال تركيزه (focus) أثناء الكتابة — هذا هو سبب قبول رقم واحد فقط سابقًا.
function updateMonthTableCalculations(table, year, m){
  let totals = {c:0,d:0,e:0,f:0,g:0,h:0};
  table.querySelectorAll("tbody tr[data-cat-id]").forEach(tr=>{
    const catId = tr.getAttribute("data-cat-id");
    const C = getAdd(year, catId, m);
    const D = calcD(year, catId, m);
    const E = calcMonthCharge(year, catId, m);
    const F = m>1 ? calcCum(year, catId, m-1) : 0;
    const G = calcCum(year, catId, m);
    const H = calcH(year, catId, m);
    totals.c+=C; totals.d+=D; totals.e+=E; totals.f+=F; totals.g+=G; totals.h+=H;
    tr.querySelector('[data-field="D"]').textContent = fmt(D);
    tr.querySelector('[data-field="E"]').textContent = fmt(E);
    tr.querySelector('[data-field="F"]').textContent = fmt(F);
    tr.querySelector('[data-field="G"]').textContent = fmt(G);
    tr.querySelector('[data-field="H"]').textContent = fmt(H);
  });
  const tfoot = table.querySelector("tfoot");
  if(tfoot){
    const set = (field, val)=>{ const c = tfoot.querySelector('[data-total-field="'+field+'"]'); if(c) c.textContent = fmt(val); };
    set("c", totals.c); set("d", totals.d); set("e", totals.e);
    set("f", totals.f); set("g", totals.g); set("h", totals.h);
  }
}

/* ============================= شاشة التقارير والرسومات ============================= */
function renderReports(){
  const year = state.currentYear;
  const wrap = el("div");

  const categoryTotals = state.categories.map(cat=>{
    const sumE = calcCum(year, cat.id, 12); // إجمالي إهلاك الفئة للسنة كاملة (يشمل الترحيل)
    return {cat, sumE, finalH: calcH(year, cat.id, 12)};
  }).sort((a,b)=>b.sumE-a.sumE);

  const topCat = categoryTotals[0];
  const grandTotalE = categoryTotals.reduce((s,x)=>s+x.sumE,0);

  const panel1 = el("div",{class:"panel"});
  panel1.appendChild(el("h2",{text:"الأكثر استهلاكًا (إهلاكًا) خلال سنة "+year}));
  panel1.appendChild(el("div",{class:"hint",text:"مرتبة تنازليًا حسب إجمالي مبلغ الإهلاك المحمّل خلال السنة لكل فئة."}));

  if(topCat && topCat.sumE>0){
    panel1.appendChild(el("div",{class:"cards"},[
      el("div",{class:"card highlight"},[
        el("div",{class:"label",text:"الفئة الأعلى استهلاكًا"}),
        el("div",{class:"value",text:topCat.cat.name})
      ]),
      el("div",{class:"card"},[
        el("div",{class:"label",text:"إجمالي إهلاكها هذه السنة"}),
        el("div",{class:"value",text:fmt(topCat.sumE)})
      ]),
      el("div",{class:"card"},[
        el("div",{class:"label",text:"نسبتها من إجمالي الإهلاك"}),
        el("div",{class:"value",text: grandTotalE>0 ? (topCat.sumE/grandTotalE*100).toFixed(1)+"%" : "—"})
      ])
    ]));
  }

  const maxVal = Math.max(1, ...categoryTotals.map(x=>x.sumE));
  const barsWrap = el("div",{style:"margin-top:14px;"});
  categoryTotals.forEach((x,i)=>{
    const pct = (x.sumE/maxVal*100).toFixed(1);
    barsWrap.appendChild(el("div",{class:"bar-row"+(i===0 && x.sumE>0 ?" top":"")},[
      el("div",{class:"bar-label", text:x.cat.name}),
      el("div",{class:"bar-track"},[ el("div",{class:"bar-fill", style:"width:"+pct+"%"}) ]),
      el("div",{class:"bar-value", text:fmt(x.sumE)})
    ]));
  });
  panel1.appendChild(barsWrap);
  wrap.appendChild(panel1);

  const panel2 = el("div",{class:"panel"});
  panel2.appendChild(el("h2",{text:"اتجاه الإهلاك الشهري خلال "+year}));
  panel2.appendChild(el("div",{class:"hint",text:"إجمالي (اهلاك يخص الشهر) لكل الفئات مجتمعة، شهرًا بشهر."}));

  const monthlyTotals = [];
  for(let m=1;m<=12;m++){
    let mE=0;
    state.categories.forEach(cat=> mE += calcMonthCharge(year,cat.id,m));
    monthlyTotals.push(mE);
  }
  panel2.appendChild(buildLineChart(monthlyTotals));
  wrap.appendChild(panel2);

  const years = existingYears();
  if(years.length>1){
    const panel3 = el("div",{class:"panel"});
    panel3.appendChild(el("h2",{text:"مقارنة السنوات"}));
    panel3.appendChild(el("div",{class:"hint",text:"إجمالي الإهلاك المحمّل خلال كل سنة، للمقارنة بين الأعوام."}));

    const yearTotalsArr = years.map(y=>({year:y, total: totalYearE(y)}));
    const maxY = Math.max(1, ...yearTotalsArr.map(x=>x.total));
    const yBars = el("div");
    yearTotalsArr.forEach(x=>{
      const pct=(x.total/maxY*100).toFixed(1);
      yBars.appendChild(el("div",{class:"bar-row"+(x.year===year?" top":"")},[
        el("div",{class:"bar-label", text:"سنة "+x.year}),
        el("div",{class:"bar-track"},[ el("div",{class:"bar-fill", style:"width:"+pct+"%"}) ]),
        el("div",{class:"bar-value", text:fmt(x.total)})
      ]));
    });
    panel3.appendChild(yBars);

    panel3.appendChild(el("h3",{text:"مقارنة تفصيلية حسب الفئة"}));
    const otherYears = years.filter(y=>y!==year);
    const compBox = el("div",{style:"margin-top:14px;"});
    const compSel = el("select",{onchange:()=>renderCategoryComparison(year, Number(compSel.value), compBox)});
    otherYears.forEach(y=> compSel.appendChild(el("option",{value:y, text:"مقارنة سنة "+year+" مع سنة "+y})));
    panel3.appendChild(compSel);
    panel3.appendChild(compBox);
    if(otherYears.length>0) renderCategoryComparison(year, otherYears[0], compBox);

    wrap.appendChild(panel3);
  }

  return wrap;
}

function totalYearE(year){
  let t=0;
  state.categories.forEach(cat=> t += calcCum(year, cat.id, 12));
  return t;
}

function renderCategoryComparison(yearA, yearB, container){
  container.innerHTML = "";
  const rows = state.categories.map(cat=>{
    const a = calcCum(yearA, cat.id, 12);
    const b = calcCum(yearB, cat.id, 12);
    return {cat, a, b};
  });
  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.a,r.b)));
  rows.forEach(r=>{
    const group = el("div",{style:"margin-bottom:14px;"});
    group.appendChild(el("div",{style:"font-size:12.8px;font-weight:700;color:var(--teal-dark);margin-bottom:4px;", text:r.cat.name}));
    const pctA=(r.a/maxVal*100).toFixed(1), pctB=(r.b/maxVal*100).toFixed(1);
    group.appendChild(el("div",{class:"bar-row"},[
      el("div",{class:"bar-label", text:"سنة "+yearA}),
      el("div",{class:"bar-track"},[ el("div",{class:"bar-fill", style:"width:"+pctA+"%"}) ]),
      el("div",{class:"bar-value", text:fmt(r.a)})
    ]));
    group.appendChild(el("div",{class:"bar-row"},[
      el("div",{class:"bar-label", text:"سنة "+yearB}),
      el("div",{class:"bar-track"},[ el("div",{class:"bar-fill", style:"width:"+pctB+"%;background:var(--amber);"}) ]),
      el("div",{class:"bar-value", text:fmt(r.b)})
    ]));
    container.appendChild(group);
  });
}

function buildLineChart(values){
  const W=760, H=260, padL=55, padR=20, padT=20, padB=36;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const maxV = Math.max(1, ...values);
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`, class:"chart-svg"});

  const gridLines = 4;
  for(let i=0;i<=gridLines;i++){
    const y = padT + innerH - (innerH*i/gridLines);
    svg.appendChild(svgEl("line",{x1:padL, x2:W-padR, y1:y, y2:y, stroke:"#DCE3DD", "stroke-width":1}));
    const val = (maxV*i/gridLines);
    const label = svgEl("text",{x:padL-8, y:y+4, "text-anchor":"end", "font-size":"10", fill:"#5C6B66"});
    label.textContent = val.toFixed(0);
    svg.appendChild(label);
  }

  const points = values.map((v,i)=>{
    const x = padL + (innerW*i/(values.length-1));
    const y = padT + innerH - (innerH * v/maxV);
    return [x,y];
  });
  const pathD = points.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  svg.appendChild(svgEl("path",{d:pathD, fill:"none", stroke:"#0E4D46", "stroke-width":2.5}));

  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${padT+innerH} L${points[0][0].toFixed(1)},${padT+innerH} Z`;
  const areaPath = svgEl("path",{d:areaD, fill:"#0E4D46", opacity:"0.08"});
  svg.insertBefore(areaPath, svg.firstChild);

  points.forEach((p,i)=>{
    svg.appendChild(svgEl("circle",{cx:p[0], cy:p[1], r:3.5, fill:"#B4772F"}));
    const lbl = svgEl("text",{x:p[0], y:H-10, "text-anchor":"middle", "font-size":"10.5", fill:"#5C6B66"});
    lbl.textContent = MONTH_SHORT[i+1];
    svg.appendChild(lbl);
  });

  return svg;
}

/* ============================= التقرير السنوي الكامل (للطباعة) ============================= */
function renderYearReport(){
  const year = state.currentYear;
  const wrap = el("div");

  const panel = el("div",{class:"panel"});
  panel.appendChild(el("h2",{text:"التقرير السنوي الكامل — "+COMPANY_NAME+" — سنة "+year}));
  panel.appendChild(el("div",{class:"row-actions no-print"},[
    el("button",{class:"btn", text:"🖨 طباعة / حفظ PDF", onclick:()=>window.print()})
  ]));

  const totalB = state.categories.reduce((s,c)=>s+getOpening(year,c.id),0);
  let totalAdditionsYear=0;
  state.categories.forEach(cat=>{ for(let m=1;m<=12;m++) totalAdditionsYear += getAdd(year,cat.id,m); });
  const totalHFinal = state.categories.reduce((s,c)=>s+calcH(year,c.id,12),0);

  panel.appendChild(el("div",{class:"cards"},[
    el("div",{class:"card"},[el("div",{class:"label",text:"الرصيد الافتتاحي"}),el("div",{class:"value",text:fmt(totalB)})]),
    el("div",{class:"card"},[el("div",{class:"label",text:"متوسط الشهر (الرصيد الافتتاحي ÷ 12)"}),el("div",{class:"value",text:fmt(totalB/12)})]),
    el("div",{class:"card"},[el("div",{class:"label",text:"إجمالي إضافات السنة"}),el("div",{class:"value",text:fmt(totalAdditionsYear)})]),
    el("div",{class:"card highlight"},[el("div",{class:"label",text:"الاستهلاك الحالي (نهاية ديسمبر)"}),el("div",{class:"value",text:fmt(totalHFinal)})]),
  ]));

  const categoryTotals = state.categories.map(cat=>{
    const sumE = calcCum(year, cat.id, 12); // إجمالي إهلاك الفئة للسنة كاملة (يشمل الترحيل)
    return {cat, sumE};
  }).sort((a,b)=>b.sumE-a.sumE);

  panel.appendChild(el("h3",{text:"ترتيب الفئات حسب الإهلاك خلال السنة"}));
  const rankTableWrap = el("div",{class:"table-wrap"});
  const rankTable = el("table");
  rankTable.appendChild(el("thead",{},[el("tr",{},[el("th",{text:"الفئة"}),el("th",{text:"إجمالي الإهلاك خلال السنة"})])]));
  const rankBody = el("tbody");
  categoryTotals.forEach(x=>{
    rankBody.appendChild(el("tr",{},[el("td",{text:x.cat.name}), el("td",{text:fmt(x.sumE)})]));
  });
  rankTable.appendChild(rankBody);
  rankTableWrap.appendChild(rankTable);
  panel.appendChild(rankTableWrap);

  wrap.appendChild(panel);

  for(let m=1;m<=12;m++){
    const monthPanel = el("div",{class:"panel"});
    monthPanel.appendChild(el("h3",{text:"شهر "+MONTH_NAMES[m]+" "+year}));
    const tw = el("div",{class:"table-wrap"});
    tw.appendChild(buildMonthTable(year, m).table);
    monthPanel.appendChild(tw);
    wrap.appendChild(monthPanel);
  }

  return wrap;
}

/* ============================= تذكير النسخة الاحتياطية ============================= */
let backupBannerDismissed = false;
function needsBackupReminder(){
  const last = state.settings.lastBackupAt;
  if(!last) return true;
  return (Date.now()-last) > 30*24*3600*1000;
}
function renderBackupBanner(){
  return el("div",{class:"banner banner-info"},[
    el("span",{text:"⏰ لم تُصدّر نسخة احتياطية منذ فترة — يُفضّل تصدير نسخة الآن حفاظًا على بياناتك."}),
    el("div",{style:"display:flex;gap:8px;"},[
      el("button",{class:"btn small", text:"تصدير الآن", onclick:()=>{ exportBackup(); render(); }}),
      el("button",{class:"btn small ghost", text:"لاحقًا", onclick:()=>{ backupBannerDismissed=true; render(); }})
    ])
  ]);
}

/* ============================= التصدير والاستيراد ============================= */
function downloadFile(filename, content, mime){
  const blob = new Blob(["\uFEFF"+content], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function exportMonthCSV(year, m){
  let rows = [["الفئة","الرصيد الافتتاحي","النسبة%","الإضافات","اهلاك الإضافات","اهلاك يخص الشهر","مجمع حتى الشهر السابق","مجمع حتى هذا الشهر","الاستهلاك الحالي"]];
  let totals=[0,0,0,0,0,0,0];
  state.categories.forEach(cat=>{
    const B=getOpening(year,cat.id), C=getAdd(year,cat.id,m), D=calcD(year,cat.id,m), E=calcMonthCharge(year,cat.id,m), F=m>1?calcCum(year,cat.id,m-1):0, G=calcCum(year,cat.id,m), H=calcH(year,cat.id,m);
    rows.push([cat.name, B.toFixed(2), getRate(cat.id), C.toFixed(2), D.toFixed(2), E.toFixed(2), F.toFixed(2), G.toFixed(2), H.toFixed(2)]);
    totals[0]+=B; totals[1]+=C; totals[2]+=D; totals[3]+=E; totals[4]+=F; totals[5]+=G; totals[6]+=H;
  });
  rows.push(["الإجمالي", totals[0].toFixed(2), "—", totals[1].toFixed(2), totals[2].toFixed(2), totals[3].toFixed(2), totals[4].toFixed(2), totals[5].toFixed(2), totals[6].toFixed(2)]);
  const csv = rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
  downloadFile(`اهلاك_${MONTH_NAMES[m]}_${year}.csv`, csv, "text/csv;charset=utf-8;");
  showToast("تم تنزيل ملف CSV");
}
function exportSummaryCSV(year){
  const totalB = state.categories.reduce((s,c)=>s+getOpening(year,c.id),0);
  let rows = [["الشهر","الرصيد الافتتاحي","إضافات الشهر","اهلاك الإضافات","اهلاك يخص الشهر","الاهلاك المجمع","الاستهلاك الحالي"]];
  for(let m=1;m<=12;m++){
    let mC=0,mD=0,mE=0,mCum=0;
    state.categories.forEach(cat=>{ mC+=getAdd(year,cat.id,m); mD+=calcD(year,cat.id,m); mE+=calcMonthCharge(year,cat.id,m); mCum+=calcCum(year,cat.id,m); });
    rows.push([MONTH_NAMES[m], totalB.toFixed(2), mC.toFixed(2), mD.toFixed(2), mE.toFixed(2), mCum.toFixed(2), (totalB+mCum).toFixed(2)]);
  }
  const csv = rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
  downloadFile(`ملخص_الاهلاك_${year}.csv`, csv, "text/csv;charset=utf-8;");
  showToast("تم تنزيل ملف CSV");
}
function exportBackup(){
  state.settings.lastBackupAt = Date.now();
  save();
  downloadFile(`نسخة_احتياطية_اهلاكات_${state.currentYear}.json`, JSON.stringify(state,null,2), "application/json");
  showToast("تم تنزيل النسخة الاحتياطية");
}
function triggerImport(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.categories || !data.years) throw new Error("صيغة غير صحيحة");
        state = data;
        save();
        render();
        showToast("تم استيراد النسخة الاحتياطية بنجاح");
      }catch(err){
        showToast("تعذر قراءة الملف: "+err.message, "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  await loadOrInit();
  currentMonth = pickStartupMonth();
